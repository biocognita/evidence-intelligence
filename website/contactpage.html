<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>Contact Us - Evidence Intelligence</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link rel="icon" href="assets/images/biocognitalogo.png">
        <link href="style.css?v=30" rel="stylesheet" type="text/css"/>
    </head>
    <body class="bodynorm">
        <nav class="navbar">
            <div class="nav-inner">
                <div class="logo">
                    <a href="index.html"><img src="assets/images/biocognitalogo.png" alt="biocognita logo" class="logopic"></a>
                </div>
                <div class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="contactpage.html" class="active">Contact Us</a>
                </div>
            </div>
        </nav>

        <main class="contact-main">
            <div class="contact-inner">
                <h1 class="contact-title">Contact Us</h1>
                <p class="contact-subtitle">
                    Questions, corrections, or feedback about a claim? Send us a
                    message and we'll get back to you.
                </p>

                <div class="contact-form-card">
                    <form id="contact-form" novalidate>
                        <!-- Honeypot: real visitors never see or fill this. -->
                        <div class="form-row form-honeypot" aria-hidden="true">
                            <label for="contact-website">Website</label>
                            <input id="contact-website" name="website" type="text" tabindex="-1" autocomplete="off">
                        </div>

                        <div class="form-row">
                            <label for="contact-name">Name</label>
                            <input id="contact-name" name="name" type="text" maxlength="100" required autocomplete="name">
                        </div>

                        <div class="form-row">
                            <label for="contact-email">Email</label>
                            <input id="contact-email" name="email" type="email" maxlength="200" required autocomplete="email">
                        </div>

                        <div class="form-row">
                            <label for="contact-topic">Topic</label>
                            <select id="contact-topic" name="topic">
                                <option>General question</option>
                                <option>Claim correction</option>
                                <option>Study suggestion</option>
                                <option>Feedback</option>
                                <option>Other</option>
                            </select>
                        </div>

                        <div class="form-row">
                            <label for="contact-message">Message</label>
                            <textarea id="contact-message" name="message" rows="6" maxlength="5000" required></textarea>
                        </div>

                        <p class="form-status" id="form-status" hidden></p>

                        <button type="submit" class="contact-submit" id="contact-submit">Send message</button>
                    </form>
                </div>
            </div>
        </main>

        <footer class="site-footer reveal">
            <p>Evidence Intelligence Project · © 2026 Biocognita</p>
        </footer>

        <script src="api_config.js"></script>
        <script src="cache_utils.js?v=29"></script>
        <script>
            // ----- Contact form -----
            // Submits to the Flask backend, which emails the message to
            // biocognita@gmail.com. Shows a friendly success/error bar.
            (function () {
                const form = document.getElementById("contact-form");
                const status = document.getElementById("form-status");
                const button = document.getElementById("contact-submit");
                if (!form || !status || !window.fetch) {
                    return;
                }

                function show(message, isError) {
                    status.textContent = message;
                    status.hidden = false;
                    status.classList.toggle("is-error", !!isError);
                    status.classList.toggle("is-success", !isError);
                }

                form.addEventListener("submit", async (event) => {
                    event.preventDefault();

                    const name = document.getElementById("contact-name").value.trim();
                    const email = document.getElementById("contact-email").value.trim();
                    const topic = document.getElementById("contact-topic").value;
                    const message = document.getElementById("contact-message").value.trim();
                    const website = document.getElementById("contact-website").value;

                    if (!name || !email || !message) {
                        show("Please fill in your name, email address and message.", true);
                        return;
                    }
                    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
                        show("Please enter a valid email address.", true);
                        return;
                    }

                    button.disabled = true;
                    button.textContent = "Sending…";
                    try {
                        const res = await fetch(`${API_BASE}/contact`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ name, email, topic, message, website })
                        });
                        const payload = await res.json().catch(() => ({}));
                        if (res.ok && payload.ok) {
                            form.reset();
                            show("Thanks — your message is on its way.", false);
                        } else {
                            show(payload.error || "Something went wrong — please try again.", true);
                        }
                    } catch (err) {
                        show("Couldn't reach the server — please try again.", true);
                    } finally {
                        button.disabled = false;
                        button.textContent = "Send message";
                    }
                });
            })();
        </script>
    </body>
</html>
