<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>Evidence Intelligence Project</title>
        <link href="style.css?v=1" rel="stylesheet" type="text/css"/>
    </head>
    <body>
        <nav class="navbar">
            <div class="logo">
                <a href="index.html"><img src="assets/images/biocognitalogo.png" alt="biocognitalogo" class="logopic"></a>
                Evidence Intelligence Project
            </div>
        </nav>

        <!-- The Free-Floating Separator Title -->

        <h1 class="searchtitle">Start here...</h1>

<!-- The Clean Search Card Block below it -->
<div class="searcharea">
    <div class="searchbar">
        <div class="searchbar-row">
            <select id="search-column" class="searchcolumn">
                <option value="Claim">Claim</option>
                <option value="Intervention">Intervention</option>
                <option value="Outcome">Outcome</option>
                <option value="Population">Population</option>
            </select>
            <input
                id="claim-input"
                type="search"
                placeholder="Search a claim or keyword..."
                class="searchbarbar"
            >
            <button id="search-button" type="button">
                <img
                    src="assets/images/searchicon.png"
                    alt="searchbutton"
                    class="searchbutton"
                >
            </button>
        </div>
        <p class="search-hint">Try a claim ID like C0001, or search by keyword — pick the field to search on the left</p>
    </div>
</div>


        <script src="scripts.js"></script>
    </body>
</html>
