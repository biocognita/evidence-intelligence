<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>Report</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link href="style.css?v=17" rel="stylesheet" type="text/css"/>
    </head>

    <body class="bodynorm">

        <nav class="navbar">
            <div class="nav-inner">
                <div class="logo">
                    <a href="index.html"><img src="assets/images/biocognitalogo.png" alt="biocognita logo" class="logopic"></a>
                </div>
                <div class="nav-links">
                    <a href="index.html" class="active">Home</a>
                    <a href="index.html#contact">Contact Us</a>
                </div>
            </div>
        </nav>

        <main class="report-main">
            <h1 id="claim"></h1>

            <h2 class="report-section-title">Overview</h2>

            <div class="report-grid">
                <section class="report-card">
                    <h3>Evidence Strength</h3>
                    <p id="strength"></p>
                </section>

                <section class="report-card">
                    <h3>Our Confidence Levels</h3>
                    <p id="score"></p>
                </section>

                <section class="report-card">
                    <h3>Population</h3>
                    <p id="population"></p>
                </section>

                <section class="report-card">
                    <h3>Intervention</h3>
                    <p id="intervention"></p>
                </section>

                <section class="report-card report-card-full">
                    <h3>Supporting Studies</h3>
                    <p id="studies"></p>
                </section>
            </div>

            <h2 class="report-section-title">Information On Individual Studies</h2>
            <div id="breakdown"></div>
        </main>

        <script src="api_config.js"></script>
        <script src="cache_utils.js"></script>
        <script>
            const CACHE_PREFIX = "evint_report";
            let query = "";

            function reportCacheKey(claimId) {
                return cacheKey(CACHE_PREFIX, claimId);
            }

            // Fill every section of the report page. `fromCache` only
            // controls whether the data came from localStorage — users never
            // need to see that, so the score looks identical either way.
            function renderReport(report, fromCache) {
                const claimEl = document.getElementById("claim");
                const populationEl = document.getElementById("population");
                const interventionEl = document.getElementById("intervention");

                // Claim heading in Title Case (owner's preference), with the
                // search query still highlighted (safe: highlightText builds
                // text nodes + <mark>, never HTML).
                claimEl.textContent = "";
                claimEl.appendChild(highlightText(toTitleCase(report.claim || ""), query));
                populationEl.textContent = "";
                populationEl.appendChild(highlightText(report.population || "", query));
                interventionEl.textContent = "";
                interventionEl.appendChild(highlightText(report.intervention || "", query));

                document.getElementById("score").textContent =
                    report.confidence_score + "/100";

                document.getElementById("strength").textContent =
                    report.evidence_strength;

                document.getElementById("studies").textContent =
                    (report.supporting_studies || []).join(", ");

                const breakdownContainer = document.getElementById("breakdown");
                breakdownContainer.innerHTML = "";

                if (report.study_breakdown && report.study_breakdown.length > 0) {
                    report.study_breakdown.forEach((study) => {
                        // One white, brown-bordered card per study
                        const studyCard = document.createElement("div");
                        studyCard.className = "study-card";

                        const header = document.createElement("div");
                        header.className = "study-card-header";

                        const idHeading = document.createElement("h3");
                        idHeading.className = "studyID";
                        idHeading.textContent = study.study_id;

                        const scoreBadge = document.createElement("span");
                        scoreBadge.className = "study-score";
                        scoreBadge.textContent = `Quality ${study.quality_score}/100`;

                        header.appendChild(idHeading);
                        header.appendChild(scoreBadge);

                        const summary = document.createElement("p");
                        summary.className = "study-summary";
                        summary.textContent = study.summary || "Study details not available";

                        studyCard.appendChild(header);
                        studyCard.appendChild(summary);

                        breakdownContainer.appendChild(studyCard);
                    });
                } else {
                    const none = document.createElement("p");
                    none.className = "report-empty";
                    none.textContent = "No study breakdown available.";
                    breakdownContainer.appendChild(none);
                }
            }

            async function loadReport() {

                const params = new URLSearchParams(window.location.search);
                const claimId = params.get("claim");
                query = (params.get("q") || "").trim();

                let report;

                if (claimId) {
                    const normalized = claimId.trim().toUpperCase();

                    // Cache hit: render instantly, skip the network round-trip
                    if (!params.get("fresh")) {
                        const cached = readCache(reportCacheKey(normalized));
                        if (cached) {
                            renderReport(cached, true);
                            return;
                        }
                    }

                    // Direct link, e.g. reportpage.html?claim=C0001
                    let response;
                    try {
                        // Always talk to the Flask backend (see api_config.js).
                        // This also works when the page is opened directly as a
                        // file or via a static preview — not just through the
                        // Flask server itself.
                        response = await fetch(`${API_BASE}/claim/${normalized}`);
                    } catch (err) {
                        document.body.innerHTML =
                            "<p>Couldn't reach the Evidence Intelligence server. " +
                            "Make sure the server is running.</p>";
                        return;
                    }

                    if (!response.ok) {
                        if (response.status === 503) {
                            // Server is up but couldn't load the Google Sheets data
                            document.body.innerHTML =
                                "<p>Database temporarily unavailable. " +
                                "Please try again later.</p>";
                        } else {
                            document.body.innerHTML =
                                `<p>Claim ${normalized} not found.</p>`;
                        }
                        return;
                    }

                    report = await response.json();
                    writeCache(reportCacheKey(normalized), report);
                    // Keep the legacy key in sync so the no-claim-param
                    // fallback branch (old search-box flow) still works.
                    localStorage.setItem("report", JSON.stringify(report));

                } else {
                    // Fallback: came here via the search box on index.html
                    const stored = localStorage.getItem("report");

                    if (!stored) {
                        document.body.innerHTML =
                            "<p>No report to show. " +
                            "<a href=\"index.html\">Search for a claim</a>.</p>";
                        return;
                    }

                    report = JSON.parse(stored);
                }

                renderReport(report, false);
            }

            loadReport();
        </script>
    </body>
</html>
