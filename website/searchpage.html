<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>Search Results - Evidence Intelligence</title>
        <link href="style.css?v=6" rel="stylesheet" type="text/css"/>
    </head>

    <body class="bodynorm">
        <nav class="navbar">
            <div class="logo">
                <a href="index.html"><img src="assets/images/biocognitalogo.png" alt="biocognitalogo" class="logopic"></a>
                Evidence Intelligence Project
            </div>
        </nav>

        <h1 class="searchtitle">Search claims</h1>

        <div class="searcharea">
            <div class="searchbar">
                <div class="searchbar-row">
                    <select id="search-column" class="searchcolumn">
                        <option value="Claim">Claim</option>
                        <option value="Intervention">Intervention</option>
                        <option value="Outcome">Outcome</option>
                        <option value="Population">Population</option>
                    </select>
                    <input
                        id="claim-input"
                        type="search"
                        placeholder="Search a claim or keyword..."
                        class="searchbarbar"
                    >
                    <button id="search-button" type="button">
                        <img
                            src="assets/images/searchicon.png"
                            alt="searchbutton"
                            class="searchbutton"
                        >
                    </button>
                </div>
            </div>
        </div>

        <p class="results-status" id="results-status">Searching…</p>

        <div id="results" class="results-area"></div>

        <div class="results-actions">
            <button id="refresh" class="refresh-btn" type="button" hidden>↻ Refresh results</button>
            <button id="load-more" class="load-more" type="button" hidden>Load more results</button>
        </div>

        <script src="api_config.js"></script>
        <script src="scripts.js"></script>
        <script src="cache_utils.js"></script>
        <script>
            const SEARCHABLE_COLUMNS = ["Claim", "Intervention", "Outcome", "Population"];
            const PAGE_SIZE = 20;
            const CACHE_PREFIX = "evint_search";

            let currentQuery = "";
            let currentColumn = "Claim";
            let currentOffset = 0;
            let hasMore = false;
            let isLoading = false;
            // Accumulates every result page fetched so far for the current
            // query+column; persisted to localStorage after each fetch.
            let cachedResults = [];

            function searchCacheKey() {
                return cacheKey(CACHE_PREFIX, currentQuery, currentColumn);
            }

            // Shared rendering: appends cards, updates status + buttons.
            // Used by both the cache-hit and network paths so they can
            // never drift out of sync.
            function renderResults(results, total, fromCache) {
                const status = document.getElementById("results-status");
                const container = document.getElementById("results");
                const loadMoreBtn = document.getElementById("load-more");
                const refreshBtn = document.getElementById("refresh");

                const shown = currentOffset + results.length;
                const suffix = fromCache ? " (cached)" : "";
                status.textContent =
                    `Showing ${shown} of ${total} claim${total === 1 ? "" : "s"} ` +
                    `matching “${currentQuery}” in ${currentColumn}:${suffix}`;

                results.forEach((claim) => {
                    container.appendChild(renderResultCard(claim));
                });

                currentOffset = shown;
                hasMore = shown < total;
                loadMoreBtn.hidden = !hasMore;
                loadMoreBtn.textContent = "Load more results";
                refreshBtn.hidden = false;
            }

            function renderStudyBreakdown(breakdown) {
                const wrapper = document.createElement("div");
                wrapper.className = "study-mini-grid";

                (breakdown || []).forEach((study) => {
                    const pill = document.createElement("span");
                    pill.className = "study-mini";
                    pill.textContent = `${study.study_id} · ${study.quality_score}/100`;
                    wrapper.appendChild(pill);
                });

                if ((breakdown || []).length === 0) {
                    const none = document.createElement("span");
                    none.className = "study-mini-empty";
                    none.textContent = "No study breakdown available";
                    wrapper.appendChild(none);
                }

                return wrapper;
            }

            function renderResultCard(claim) {
                const card = document.createElement("a");
                card.className = "result-card";
                // Carry the query along so the report page can highlight
                // the same matches.
                card.href = `reportpage.html?claim=${encodeURIComponent(claim["Claim ID"])}` +
                    `&q=${encodeURIComponent(currentQuery)}`;

                const idLine = document.createElement("div");
                idLine.className = "result-id";
                idLine.textContent = claim["Claim ID"];

                const scoreLine = document.createElement("div");
                scoreLine.className = "result-score";
                if (typeof claim.confidence_score === "number") {
                    scoreLine.textContent =
                        `Confidence ${claim.confidence_score}/100 · ${claim.evidence_strength || "n/a"}`;
                } else {
                    scoreLine.textContent = "No score available";
                }

                // Claim text with the matching substring highlighted
                const claimLine = document.createElement("div");
                claimLine.className = "result-claim";
                claimLine.appendChild(highlightText(claim["Claim"] || "", currentQuery));

                // Meta line: also highlight the query wherever it appears
                const metaLine = document.createElement("div");
                metaLine.className = "result-meta";
                const meta = [
                    claim["Intervention"],
                    claim["Outcome"],
                    claim["Population"]
                ].filter(Boolean);
                const metaText = meta.join(" · ") || "No details available";
                metaLine.appendChild(highlightText(metaText, currentQuery));

                card.appendChild(idLine);
                card.appendChild(scoreLine);
                card.appendChild(claimLine);
                card.appendChild(metaLine);
                card.appendChild(renderStudyBreakdown(claim.study_breakdown));

                return card;
            }

            async function loadSearchResults(reset = true) {

                // Guard against double-clicking Load more: two concurrent
                // fetches would append the same page twice.
                if (isLoading) {
                    return;
                }
                isLoading = true;
                const loadMoreBtn = document.getElementById("load-more");
                if (!reset) {
                    loadMoreBtn.textContent = "Loading more…";
                }

                const params = new URLSearchParams(window.location.search);
                const status = document.getElementById("results-status");
                const container = document.getElementById("results");

                if (reset) {
                    currentQuery = (params.get("q") || "").trim();
                    currentColumn = SEARCHABLE_COLUMNS.includes(params.get("col"))
                        ? params.get("col")
                        : "Claim";
                    currentOffset = 0;
                    hasMore = false;
                    cachedResults = [];
                    document.getElementById("refresh").hidden = true;

                    // Prefill the search box + column picker so users can refine
                    document.getElementById("claim-input").value = currentQuery;
                    document.getElementById("search-column").value = currentColumn;

                    if (!currentQuery) {
                        status.textContent =
                            "Type a keyword above to search the claim database.";
                        loadMoreBtn.hidden = true;
                        isLoading = false;
                        loadMoreBtn.textContent = "Load more results";
                        return;
                    }

                    container.innerHTML = "";
                    status.textContent = "Searching…";

                    // Cache hit: render instantly, skip the network round-trip
                    const cached = readCache(searchCacheKey());
                    if (cached && !params.get("fresh")) {
                        // Guard against corrupt storage: only accept arrays
                        cachedResults = Array.isArray(cached.results) ? cached.results : [];
                        renderResults(cachedResults, cached.total, true);
                        isLoading = false;
                        return;
                    }
                }

                let payload;
                try {
                    const searchParams = new URLSearchParams({
                        q: currentQuery,
                        col: currentColumn,
                        limit: String(PAGE_SIZE),
                        offset: String(currentOffset)
                    });
                    const response = await fetch(`${API_BASE}/search?${searchParams.toString()}`);
                    if (!response.ok) {
                        throw new Error(`Search failed (HTTP ${response.status})`);
                    }
                    payload = await response.json();
                } catch (err) {
                    status.textContent =
                        "Couldn't reach the Evidence Intelligence server. " +
                        "Make sure the server is running.";
                    loadMoreBtn.hidden = true;
                    isLoading = false;
                    loadMoreBtn.textContent = "Load more results";
                    return;
                }

                if (payload.total === 0) {
                    status.textContent =
                        `No claims match “${currentQuery}” in ${currentColumn}. Try another keyword.`;
                    loadMoreBtn.hidden = true;
                    isLoading = false;
                    loadMoreBtn.textContent = "Load more results";
                    return;
                }

                // Extend + persist the accumulated result cache, then render
                cachedResults = cachedResults.concat(payload.results);
                writeCache(searchCacheKey(), {
                    total: payload.total,
                    results: cachedResults
                });
                renderResults(payload.results, payload.total, false);
                isLoading = false;
            }

            document.getElementById("load-more").addEventListener("click", () => {
                loadSearchResults(false);
            });

            // Manual refresh: drop the cached entry and re-fetch fresh data.
            // ?fresh=1 also bypasses the cache on page load (used here and
            // available as a URL shortcut).
            document.getElementById("refresh").addEventListener("click", () => {
                clearCache(searchCacheKey());
                const url = new URL(window.location.href);
                url.searchParams.set("fresh", "1");
                window.location.href = url.toString();
            });

            loadSearchResults(true);
        </script>
    </body>
</html>
