                </div>
                <div class="sk-result">
                    <div class="sk sk-pill"></div>
                    <div class="sk sk-claim-line"></div>
                    <div class="sk sk-claim-line short"></div>
                    <div class="sk sk-meta-line"></div>
                    <div class="sk-mini-row">
                        <div class="sk sk-mini"></div>

                        <div class="sk sk-mini"></div>

                <div class="sk-result">

        <div class="results-actions" id="results-actions" hidden>

        <script src="api_config.js"></script>
        <script src="scripts.js?v=29"></script>
        <script src="cache_utils.js?v=29"></script>
        <script>
            const SEARCHABLE_COLUMNS = ["Claim", "Intervention", "Outcome", "Population"];
            const PAGE_SIZE = 20;
            const CACHE_PREFIX = "evint_search";

            let currentQuery = "";
            // "All fields" = no ?col= sent; the backend searches every
            // searchable text column (claim, claim ID, intervention, etc.).
            let currentColumn = "All fields";
            let currentOffset = 0;
            let hasMore = false;
            let isLoading = false;
            // Accumulates every result page fetched so far for the current
            // query+column; persisted to localStorage after each fetch.
            let cachedResults = [];

            function searchCacheKey() {
                return cacheKey(CACHE_PREFIX, currentQuery, currentColumn);
            }

            // Shared rendering: appends cards, updates status + buttons.
            // Used by both the cache-hit and network paths so they can
            // never drift out of sync.                // Status-line helper: normal messages are plain text,
                // empty/error states get the bar treatment (like the
                // injected server-error bars).
                function setStatus(message, bar = false) {
                    const el = document.getElementById("results-status");
                    el.textContent = message;
                    el.classList.toggle("is-bar", bar);
                }

                // Skeleton grid shown while the first search is in flight
                const skeletonEl = document.getElementById("results-skeleton");
                function showSearchSkeleton() {
                    // No-op once the skeleton has been removed from the DOM
                    // (e.g. a "Load more" fetch after the first render).
                    if (skeletonEl.isConnected) {
                        skeletonEl.hidden = false;
                    }
                }
                function dismissSearchSkeleton() {
                    if (skeletonEl.hidden || !skeletonEl.isConnected) return;
                    skeletonEl.classList.add("sk-leaving");
                    const finish = () => skeletonEl.remove();
                    skeletonEl.addEventListener("transitionend", finish, { once: true });
                    setTimeout(finish, 600);
                }

                // Fill the cute results header: query + count chips, and a
                // short status line (the chips already carry the detail).
                function showResultsHeader(count, total) {
                    const header = document.getElementById("results-header");
                    header.hidden = false;
                    header.classList.add("report-reveal");
                    document.getElementById("chip-query").textContent =
                        `“${currentQuery}”`;
                    document.getElementById("chip-count").textContent =
                        total === 0
                            ? "No claims"
                            : `${count} of ${total} claim${total === 1 ? "" : "s"}`;
                }

                // Re-render every accumulated card with the query
                // highlighted again (used by the query chip).
                function reHighlightResults() {
                    matchHighlightsDismissed = false;
                    const container = document.getElementById("results");
                    container.innerHTML = "";
                    cachedResults.forEach((claim) => {
                        container.appendChild(renderResultCard(claim));
                    });
                    armHighlightDismissal();
                }

                function renderResults(results, total) {
                dismissSearchSkeleton();
                const container = document.getElementById("results");
                const loadMoreBtn = document.getElementById("load-more");
                const refreshBtn = document.getElementById("refresh");

                // Reveal the action buttons row with the first batch of
                // results (it stays hidden until there's something to do).
                const actions = document.getElementById("results-actions");
                if (actions.hidden) {
                    actions.hidden = false;
                    actions.classList.add("report-reveal");
                }

                const shown = currentOffset + results.length;
                showResultsHeader(shown, total);
                setStatus(`in ${currentColumn}`);

                // Stagger the cards in so a full page of results sweeps in
                // gently instead of popping in all at once. Cap the delay
                // so a 20-card page doesn't crawl for a full second.
                results.forEach((claim, index) => {
                    const card = renderResultCard(claim);
                    card.classList.add("report-reveal");
                    card.style.animationDelay = `${Math.min(index * 45, 450)}ms`;
                    container.appendChild(card);
                });

                currentOffset = shown;
                hasMore = shown < total;
                loadMoreBtn.hidden = !hasMore;
                loadMoreBtn.textContent = "Load more results";
                refreshBtn.hidden = false;

                // If the user already clicked (dismissing highlights),
                // strip them from any freshly loaded cards too.
                purgeDismissedHighlights();
            }

            function renderStudyBreakdown(breakdown) {
                const wrapper = document.createElement("div");
                wrapper.className = "study-mini-grid";

                (breakdown || []).forEach((study) => {
                    const pill = document.createElement("span");
                    pill.className = "study-mini";
                    pill.textContent = `${study.study_id} · ${study.quality_score}/100`;
                    wrapper.appendChild(pill);
                });

                if ((breakdown || []).length === 0) {
                    const none = document.createElement("span");
                    none.className = "study-mini-empty";
                    none.textContent = "No study breakdown available";
                    wrapper.appendChild(none);
                }

                return wrapper;
            }

            function renderResultCard(claim) {
                const card = document.createElement("a");
                card.className = "result-card";
                // Carry the query along so the report page can highlight
                // the same matches.
                card.href = `reportpage.html?claim=${encodeURIComponent(claim["Claim ID"])}` +
                    `&q=${encodeURIComponent(currentQuery)}`;

                const idLine = document.createElement("div");
                idLine.className = "result-id";
                idLine.textContent = claim["Claim ID"];

                const scoreLine = document.createElement("div");
                scoreLine.className = "result-score";
                if (typeof claim.confidence_score === "number") {
                    scoreLine.textContent =
                        `Confidence ${claim.confidence_score}/100 · ${claim.evidence_strength || "n/a"}`;
                } else {
                    scoreLine.textContent = "No score available";
                }

                // Claim text in Title Case (owner's preference) with the
                // matching substring highlighted
                const claimLine = document.createElement("div");
                claimLine.className = "result-claim";
                claimLine.appendChild(highlightText(toTitleCase(claim["Claim"] || ""), currentQuery));

                // Meta line: also highlight the query wherever it appears
                const metaLine = document.createElement("div");
                metaLine.className = "result-meta";
                const meta = [
                    claim["Intervention"],
                    claim["Outcome"],
                    claim["Population"]
                ].filter(Boolean);
                const metaText = meta.join(" · ") || "No details available";
                metaLine.appendChild(highlightText(metaText, currentQuery));

                card.appendChild(idLine);
                card.appendChild(scoreLine);
                card.appendChild(claimLine);
                card.appendChild(metaLine);
                card.appendChild(renderStudyBreakdown(claim.study_breakdown));

                return card;
            }

            async function loadSearchResults(reset = true) {

                // Guard against double-clicking Load more: two concurrent
                // fetches would append the same page twice.
                if (isLoading) {
                    return;
                }
                isLoading = true;
                const loadMoreBtn = document.getElementById("load-more");
                if (!reset) {
                    loadMoreBtn.textContent = "Loading more…";
                }

                const params = new URLSearchParams(window.location.search);
                const container = document.getElementById("results");

                if (reset) {
                    currentQuery = (params.get("q") || "").trim();
                    currentColumn = SEARCHABLE_COLUMNS.includes(params.get("col"))
                        ? params.get("col")
                        : "All fields";
                    currentOffset = 0;
                    hasMore = false;
                    cachedResults = [];
                    document.getElementById("refresh").hidden = true;

                    // Prefill the search box so users can refine
                    document.getElementById("claim-input").value = currentQuery;

                    if (!currentQuery) {
                        document.getElementById("results-header").hidden = true;
                        setStatus(
                            "Type a keyword above to search the claim database.",
                            true
                        );
                        loadMoreBtn.hidden = true;
                        isLoading = false;
                        loadMoreBtn.textContent = "Load more results";
                        return;
                    }

                    container.innerHTML = "";
                    setStatus("Searching…");
                    document.getElementById("results-header").hidden = true;

                    // Cache hit: render instantly, skip the network round-trip
                    const cached = readCache(searchCacheKey());
                    if (cached && !params.get("fresh")) {
                        // Guard against corrupt storage: only accept arrays
                        cachedResults = Array.isArray(cached.results) ? cached.results : [];
                        renderResults(cachedResults, cached.total);
                        isLoading = false;
                        return;
                    }
                }

                // Skeleton grid shown while the first search is in flight,
                // so the page reads as "content is coming" instead of blank.
                showSearchSkeleton();

                let payload;
                try {
                    const searchParams = new URLSearchParams({
                        q: currentQuery,
                        limit: String(PAGE_SIZE),
                        offset: String(currentOffset)
                    });
                    // Only pin a specific column when the URL asked for one;
                    // otherwise let the backend search all fields.
                    if (currentColumn !== "All fields") {
                        searchParams.set("col", currentColumn);
                    }
                    const response = await fetch(`${API_BASE}/search?${searchParams.toString()}`);
                    if (!response.ok) {
                        const err = new Error(`Search failed (HTTP ${response.status})`);
                        err.status = response.status;
                        throw err;
                    }
                    payload = await response.json();
                } catch (err) {
                    dismissSearchSkeleton();
                    document.getElementById("results-header").hidden = true;
                    setStatus(
                        err && err.status === 503
                            ? "Database temporarily unavailable. Please try again in a moment."
                            : "Couldn't reach the Evidence Intelligence server. " +
                              "Make sure the server is running.",
                        true
                    );
                    loadMoreBtn.hidden = true;
                    isLoading = false;
                    loadMoreBtn.textContent = "Load more results";
                    return;
                }

                if (payload.total === 0) {
                    dismissSearchSkeleton();
                    // The header box is the container here, so the message
                    // is plain text inside it (no extra bar).
                    showResultsHeader(0, 0);
                    setStatus("No claims found. Try another keyword.");
                    loadMoreBtn.hidden = true;
                    isLoading = false;
                    loadMoreBtn.textContent = "Load more results";
                    return;
                }

                // Extend + persist the accumulated result cache, then render
                cachedResults = cachedResults.concat(payload.results);
                writeCache(searchCacheKey(), {
                    total: payload.total,
                    results: cachedResults
                });
                renderResults(payload.results, payload.total);
                isLoading = false;
            }

            document.getElementById("load-more").addEventListener("click", () => {
                loadSearchResults(false);
            });

            // Clicking the query chip brings the highlights back.
            document.getElementById("chip-query").addEventListener("click", reHighlightResults);

            // Manual refresh: drop the cached entry and re-fetch fresh data.
            // ?fresh=1 also bypasses the cache on page load (used here and
            // available as a URL shortcut).
            document.getElementById("refresh").addEventListener("click", () => {
                clearCache(searchCacheKey());
                const url = new URL(window.location.href);
                url.searchParams.set("fresh", "1");
                // Re-fetch via a soft page transition when available
                if (window.transitionTo) {
                    window.transitionTo(url.toString());
                } else {
                    window.location.href = url.toString();
                }
            });

            loadSearchResults(true);

            // The first click anywhere on the page removes the match
            // highlights (they're a hint, not decoration).
            initMatchHighlightDismissal();
        </script>
